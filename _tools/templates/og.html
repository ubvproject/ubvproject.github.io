<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Michroma&family=Unbounded:wght@500&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0D0E10; }
  body { display: flex; color: #E9E9E6; -webkit-font-smoothing: antialiased; font-family: "Unbounded", sans-serif; }
  .l { flex: 1; padding: 62px 56px 56px 72px; display: flex; flex-direction: column; position: relative; }
  .brand { display: flex; align-items: center; gap: 18px; font: 400 22px "Michroma", sans-serif; letter-spacing: .18em; }
  .brand svg { width: 52px; height: 52px; }
  .kind { margin-top: auto; font: 500 18px "IBM Plex Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: #FF5A1F; }
  h1 { font-size: {{title_size}}px; line-height: 1.1; margin: 16px 0 0; font-weight: 500; letter-spacing: -.01em; }
  .meta { margin-top: 26px; padding-top: 16px; border-top: 1px solid #2A2D33; font: 500 20px "IBM Plex Mono", monospace; color: #A4A9B0; display: flex; gap: 28px; }
  .meta .code { color: #FF7A45; }
  .r { width: 400px; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 50%, rgba(255,90,31,.16), transparent 62%); }
  .r img { width: 300px; border: 1px solid #2A2D33; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
</style></head>
<body>
  <div class="l">
    <div class="brand">{{logo}}<span>UBVPROJECT</span></div>
    <div class="kind">{{kind}}</div>
    <h1>{{title}}</h1>
    <div class="meta">{{meta}}</div>
  </div>
  {{right}}
</body></html>
